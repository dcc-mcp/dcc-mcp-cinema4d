tools:
  - name: get_status
    description: Verify licensed c4dpy, Cinema 4D/API versions, workspace roots, and limits.
    source_file: scripts/get_status.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: get_capabilities
    description: List typed document/modeling methods, primitives, formats, and safety boundaries.
    source_file: scripts/get_capabilities.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: create_document
    description: Create an empty durable C4D document with atomic destination replacement.
    source_file: scripts/create_document.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, maxLength: 4096}
        overwrite: {type: boolean, default: false}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    next-tools: {on-success: [inspect_document], on-failure: [get_status]}

  - name: inspect_document
    description: Inspect C4D document metadata, hierarchy, transforms, geometry counts, bounds, and materials.
    source_file: scripts/inspect_document.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, maxLength: 4096}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}

  - name: validate_document
    description: Load a C4D document and report object count, duplicate names, and warnings.
    source_file: scripts/validate_document.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, maxLength: 4096}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}

  - name: save_copy
    description: Save a C4D document to a new atomic output without changing the source.
    source_file: scripts/save_copy.py
    input_schema:
      type: object
      required: [source_path, output_path]
      properties:
        source_path: {type: string, minLength: 1, maxLength: 4096}
        output_path: {type: string, minLength: 1, maxLength: 4096}
        overwrite: {type: boolean, default: false}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
